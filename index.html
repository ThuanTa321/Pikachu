<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pikachu</title>

    <script src="game.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1 class="title">Pikachu</h1>
        <!-- Chọn lv -->
        <div class="menu-lv">
            <p>Chọn cấp độ để bắt đầu</p>
            <div class="level-button">
                <button class="level-btn" onclick="SetLv(1)">Level 1</button>
                <button class="level-btn" onclick="SetLv(2)">Level 2</button>
                <button class="level-btn" onclick="SetLv(3)">Level 3</button>
                <button class="level-btn" onclick="SetLv(4)">Level 4</button>
                <button class="level-btn" onclick="SetLv(5)">Level 5</button>
                <button class="level-btn" onclick="SetLv(6)">Level 6</button>
            </div>
        </div>

        <!-- play game -->
        <div class="menu-game">
            <div class="left-panel">
                <div class="menu">
                    <div>Điểm: <span id="score">0</span></div>
                    <div>Thời gian: <span id="time">---</span>s</div>
                </div>
                <div class="restart-button">
                    <button id="hint" class="hint-button" onclick="hint()">💡<span id="hint-count">--</span></button>
                    <button id="hammer" class="hammer-button" onclick="useHammer()">🔨<span id="hammer-count">--</span></button>
                    <button class="shuffle" onclick="shuffleBoard()">Trộn lại</button>
                    <button class="restart" onclick="SetReplay()">Chơi lại</button>
                    <button class="back-to-menu" onclick="SetMenu()">Chọn lại cấp độ</button>
                </div>
            </div>

            <div id="board">
                    <svg id="game"></svg>
                <div id="overlay"><p id="overlay-text"></p>
                    <div class="overlay-button">
                        <button onclick="SetReplay()">Chơi lại</button>
                        <button onclick="SetMenu()">Chọn level</button>
                        <button id="next-level" onclick="NextLevel()">Level tiếp theo</button>
                    </div>
                </div>
            </div>
        </div>

</body>
</html>
